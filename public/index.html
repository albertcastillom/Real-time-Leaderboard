<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Real Time Leaderboard</title>
</head>
<body>
    <div class="flex-container">
        <div id = game-container>
            <h1>Target Practice</h1>
            
            <button id="start-button" type="button">Start Game</button>
            <div class="game-stats" aria-live="polite">
                <span id="display">15.00 seconds</span>
                <span id="score-display">Score: 0</span>
            </div>

            <div id="game-area" aria-label="Target practice game area">
                <button class="target" type="button" aria-label="Target"></button>
            </div>
        </div>
        <div id="leaderboard-container">
            <h1>Leaderboard</h1>
            <table>
                <thead>
                    <tr>
                        <th>Rank</th>
                        <th>Name</th>
                        <th>Score</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body">
                    <!-- Leaderboard entries will be dynamically inserted here -->
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
